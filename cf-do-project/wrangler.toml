name = "llm-ws-relay"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[durable_objects]
bindings = [{ name = "STREAM_RELAY", class_name = "StreamRelayDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StreamRelayDO"]

[vars]
# 你的真实大模型上游地址（也可以接 CF AI Gateway 或 NewAPI）
UPSTREAM_BASE_URL = ""
# RELAY_SECRET 使用 npx wrangler secret put RELAY_SECRET 设置，不写入本文件。
