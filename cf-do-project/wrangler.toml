name = "llm-ws-relay"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[durable_objects]
bindings = [{ name = "STREAM_RELAY", class_name = "StreamRelayDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StreamRelayDO"]

[vars]
# 你的真实大模型上游地址（也可以接 CF AI Gateway 或 NewAPI）
UPSTREAM_BASE_URL = ""
# 自定义一个暗号，防止别人盗刷你的 CF 节点
RELAY_SECRET = "YOUR_STRONG_PASSWORD"
